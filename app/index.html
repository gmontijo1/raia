<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a6c8c">
<meta name="description" content="Cronômetro de beira de piscina e evolução de cada nadador.">
<title>Raia</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icones/icone-180.png">
<link rel="stylesheet" href="css/raia.css">
<script>
  // Mostra um aviso visível se o app quebrar (ajuda a relatar o problema).
  (function () {
    function mostrar(msg) {
      var el = document.getElementById('erro-app');
      if (!el) return;
      el.querySelector('span').textContent = msg;
      el.hidden = false;
    }
    window.addEventListener('error', function (e) { mostrar(e.message || 'erro desconhecido'); });
    window.addEventListener('unhandledrejection', function (e) { mostrar((e.reason && e.reason.message) || String(e.reason)); });
    setTimeout(function () {
      if (!document.documentElement.dataset.pronto) mostrar('o app não terminou de carregar. Recarregue a página; se continuar, use um navegador atualizado (Chrome, Safari ou Edge).');
    }, 8000);
  })();
</script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<header class="topo">
  <div class="topo-in">
    <a class="marca" href="#/">Raia</a>
    <nav class="nav" aria-label="Menu">
      <a href="#/" data-menu="turmas">Turmas</a>
      <a href="#/dados" data-menu="dados">Dados</a>
    </nav>
  </div>
  <div class="corda" aria-hidden="true"></div>
</header>
<div id="erro-app" class="faixa erro" role="alert" hidden><b>Erro no app:</b> <span></span></div>
<div id="faixa-atualizacao" class="faixa" role="status" hidden>
  <span>Há uma versão nova do Raia.</span>
  <button id="btn-atualizar" class="btn pequeno primario" type="button">Atualizar agora</button>
</div>
<main id="tela" class="wrap">
  <noscript><p>O Raia precisa de JavaScript ligado no navegador.</p></noscript>
</main>
<div id="aviso" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
